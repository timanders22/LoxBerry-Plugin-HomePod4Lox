<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Center Motif: HomePod & Speech Waves -->
    <g transform="translate(256, 185) scale(1.15)">
      
      <!-- HomePod Body (Klassischer, sanft gerundeter Zylinder) -->
      <path d="M -40 -35 
               C -40 -60 40 -60 40 -35 
               L 40 45 
               C 40 70 -40 70 -40 45 Z" fill="#ffffff" />

      <!-- Top Display Cutout (Siri Touch-Fläche oben) -->
      <ellipse cx="0" cy="-45" rx="26" ry="6" fill="#6dac20" />

      <!-- Basis-Schattenfuge unten -->
      <path d="M -26 50 Q 0 58 26 50" fill="none" stroke="#6dac20" stroke-width="4.5" stroke-linecap="round" />

      <!-- Siri Sprachausgabe / Waveform Cutout (Zentrum) -->
      <rect x="-18" y="-4" width="6" height="12" rx="3" fill="#6dac20" />
      <rect x="-6" y="-16" width="6" height="36" rx="3" fill="#6dac20" />
      <rect x="6" y="-8" width="6" height="20" rx="3" fill="#6dac20" />
      <rect x="18" y="-2" width="6" height="12" rx="3" fill="#6dac20" />

      <!-- Abstrahlende Schallwellen (Links) -->
      <g fill="none" stroke="#ffffff" stroke-linecap="round">
        <path d="M -70 -10 A 30 30 0 0 0 -70 40" stroke-width="5" />
        <path d="M -85 -25 A 50 50 0 0 0 -85 55" stroke-width="5" opacity="0.7" />
        <path d="M -100 -40 A 70 70 0 0 0 -100 70" stroke-width="5" opacity="0.4" />
      </g>

      <!-- Abstrahlende Schallwellen (Rechts) -->
      <g fill="none" stroke="#ffffff" stroke-linecap="round">
        <path d="M 70 -10 A 30 30 0 0 1 70 40" stroke-width="5" />
        <path d="M 85 -25 A 50 50 0 0 1 85 55" stroke-width="5" opacity="0.7" />
        <path d="M 100 -40 A 70 70 0 0 1 100 70" stroke-width="5" opacity="0.4" />
      </g>

    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">HomePod</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>