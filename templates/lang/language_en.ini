[LOX]
WAS_IST_DAS = "Nothing has to be created in Loxone Config: HomePod4Lox is a speech target for other plugins on this LoxBerry."
S1_TITEL = "1. Allow access on the HomePod"
S1_TEXT = "In the Home app on iPhone or iPad: home settings, “Allow Speaker and TV Access” set to “Everyone” or “Anyone on the Same Network”; no password. Then restart the HomePod. With “Only People Sharing This Home” the plugin cannot play."
S2_TITEL = "2. Search devices and choose a default"
S2_TEXT = "Tab Settings. The LoxBerry and the HomePod must be on the same network (mDNS)."
S3_TITEL = "3. Connect another plugin to the HomePod"
S3_TEXT = "Plugins with speech module 1.4.0 or later know the target “Apple HomePod”: it is enough to select it there; they pick up the token themselves. By hand, on the LoxBerry (the speech token is in config/plugins/homepod4lox/homepod4lox.cfg, this page does not show it):"
S4_TITEL = "4. Show the state in Loxone (optional)"
S4_TEXT = "The status line can be read without a token and queried with a Virtual HTTP Input. Speaking works only from this LoxBerry; the Miniserver cannot call the endpoint directly."
S5_TITEL = "Limits"
S5_TEXT = "Playback running on the HomePod is interrupted and not resumed (expected from AirPlay, not measured). Several devices do not play in sync. Stereo pairs: according to third-party reports not reliable; if in doubt address a single device or dissolve the pair. The plugin does not see groups from the Home app."

