; HomePod4Lox - Hilfetexte. Gehoert zu templates/help/help.html.

[HILFE]
K01 = "HomePod4Lox"
K02 = "Gibt Sprachansagen anderer Plugins über AirPlay auf einem Apple HomePod oder HomePod mini aus. Ohne HomePod gebaut und nicht am Gerät gemessen; Rückmeldung erbeten."
K03 = "Am HomePod einstellen"
K04 = "Home-App, Einstellungen des Zuhauses, „Zugriff auf Lautsprecher und TV erlauben“: „Jeder“ oder „Jeder im selben Netzwerk“, kein Kennwort; danach den HomePod neu starten. Eine Kopplung ist nicht vorgesehen, der HomePod kann keinen Code anzeigen."
K05 = "So gehen Sie vor"
K06 = "Reiter Einstellungen: Geräte suchen, Standardgerät wählen, speichern."
K07 = "Reiter Test: Testansage auslösen und das Ergebnis unter „Letzte Ansage“ lesen."
K08 = "Im sprechenden Plugin das Ziel „Apple HomePod“ wählen, sobald sein Sprachmodul es kennt."
K09 = "Was das Plugin nicht belastet"
K10 = "Es gibt keinen Dauerdienst: Das Plugin startet nur für eine Ansage und endet danach. Ohne Gerät läuft nichts."
K11 = "Datenschutz"
K12 = "Ansagetexte stehen nicht im Protokoll. Die lokale Sprachquelle braucht kein Internet; bei der Sprachquelle Google gehen die Texte an Google."
