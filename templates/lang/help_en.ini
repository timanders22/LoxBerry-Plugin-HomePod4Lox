; HomePod4Lox - Hilfetexte. Gehoert zu templates/help/help.html.

[HILFE]
K01 = "HomePod4Lox"
K02 = "Plays announcements of other plugins via AirPlay on an Apple HomePod or HomePod mini. Built without a HomePod and not measured on the device; feedback welcome."
K03 = "To set on the HomePod"
K04 = "Home app, home settings, “Allow Speaker and TV Access”: “Everyone” or “Anyone on the Same Network”, no password; then restart the HomePod. Pairing is not planned, the HomePod cannot show a code."
K05 = "How to proceed"
K06 = "Tab Settings: search devices, choose a default device, save."
K07 = "Tab Test: trigger the test announcement and read the result under “Last announcement”."
K08 = "Select the target “Apple HomePod” in the speaking plugin as soon as its speech module knows it."
K09 = "What does not load the system"
K10 = "There is no permanent service: the plugin starts only for an announcement and ends afterwards. Without a device nothing runs."
K11 = "Privacy"
K12 = "Announcement texts are not in the log. The local speech source needs no internet; with the speech source Google the texts go to Google."
