[AUTHOR]
# Diese beiden Felder sind die KENNUNG des Plugins: LoxBerry bildet daraus mit [PLUGIN] NAME den Schluessel fuer Updates. Nie aendern.
NAME=HomePod4Lox Plugin Authors
EMAIL=homepod4lox-loxberry@users.noreply.github.com

[PLUGIN]
VERSION=0.9.1
NAME=homepod4lox
FOLDER=homepod4lox
TITLE=HomePod4Lox

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# Ohne Architekturbindung; armv7 ist nicht geprueft, die Installation sagt, wenn pip scheitert.
ARCHITECTURE=
CUSTOM_LOGLEVELS=false

[AUTOUPDATE]
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-HomePod4Lox/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-HomePod4Lox/main/prerelease.cfg
